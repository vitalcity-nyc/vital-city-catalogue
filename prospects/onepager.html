<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Vital City — at a glance</title>
<style>
  @font-face{font-family:'GascogneTS';src:url('../growth/fonts/GascogneTS-Light.ttf') format('truetype');font-weight:300 900;font-style:normal;font-display:swap;}
  :root{
    --vc-paper:#f7f7f4; --vc-white:#fff; --vc-black:#050507; --vc-charcoal:#707175;
    --vc-cloud:#dddddd; --vc-green:#57aa4a; --vc-orange:#ff7c53; --vc-cerulean:#217ebe;
    --vc-paper2:#eeeeec; --vc-chartreuse:#d7df23;
    --vc-sans:"halyard-text","Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    --vc-serif:"GascogneTS",Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--vc-paper2);color:var(--vc-black);font-family:var(--vc-sans);-webkit-font-smoothing:antialiased}
  a{color:var(--vc-cerulean);text-decoration:none}

  /* ---- gate (same behaviour as the deck) ---- */
  .gate{position:fixed;inset:0;background:var(--vc-paper);display:flex;align-items:center;justify-content:center;z-index:500}
  .gatebox{background:var(--vc-white);border:1px solid var(--vc-black);padding:34px 38px;max-width:420px;box-shadow:7px 7px 0 rgba(5,5,7,.14)}
  .gatebox h1{font-family:var(--vc-serif);font-weight:300;font-size:26px;margin:0 0 6px}
  .gatebox p{font-size:13px;color:var(--vc-charcoal);margin:0 0 14px;line-height:1.5}
  .gatebox input{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--vc-black);margin-bottom:10px}
  .gatebox button{font:inherit;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:11px 16px;background:var(--vc-black);color:#fff;border:0;cursor:pointer;width:100%}
  .err{color:#c8102e;font-size:12.5px;min-height:18px;margin-top:8px}

  /* ---- toolbar (screen only) ---- */
  .bar{display:flex;gap:10px;align-items:center;justify-content:center;padding:14px;font-size:12.5px;color:var(--vc-charcoal)}
  .bar button,.bar a{font:inherit;font-weight:800;font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:9px 14px;border:1.5px solid var(--vc-black);background:var(--vc-white);color:var(--vc-black);cursor:pointer;border-radius:3px}
  .bar button.primary{background:var(--vc-black);color:#fff}

  /* ---- the page: US Letter portrait ---- */
  .sheet{width:8.5in;min-height:11in;margin:0 auto 24px;background:var(--vc-white);padding:.5in .58in .45in;box-shadow:0 4px 30px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:11px}
  .mast{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--vc-black);padding-bottom:10px}
  .wordmark{font-weight:900;font-size:13px;letter-spacing:.22em;text-transform:uppercase}
  .mast h1{font-family:var(--vc-serif);font-weight:300;font-size:34px;line-height:1;margin:6px 0 0;letter-spacing:-.01em}
  .mast .tag{font-size:12px;color:var(--vc-charcoal);margin-top:6px}
  .mast .asof{font-size:10.5px;color:var(--vc-charcoal);text-align:right;line-height:1.5}
  .mast h1{font-size:30px}
  .mast .dek{font-size:11.5px;line-height:1.45;color:var(--vc-black);margin-top:7px;max-width:62ch}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--vc-cloud);border:1px solid var(--vc-cloud)}
  .tile{background:var(--vc-white);padding:8px 10px 7px}
  .tile .n{font-weight:900;font-size:22px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .tile .l{font-size:8.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin-top:4px;line-height:1.25}
  .tile .s{font-size:9.5px;color:var(--vc-charcoal);margin-top:2px;line-height:1.3}
  .cols{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;flex:1}
  .funds .fx{font-size:10px;line-height:1.4}
  .funds .fx b{font-weight:800}
  .roles{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 6px}
  .role{font-size:9.5px;padding:2px 7px;background:var(--vc-paper2);border-radius:2px;white-space:nowrap}
  .role b{font-weight:900}
  .most{font-size:10px;line-height:1.4;margin-top:6px;padding:6px 8px;background:var(--vc-paper2)}
  .most b{font-weight:800}
  .band{font-family:var(--vc-serif);font-size:15px;line-height:1.3;border-top:1.5px solid var(--vc-black);padding-top:9px}
  .sec{font-size:10px;text-transform:uppercase;letter-spacing:.11em;font-weight:900;border-bottom:1.5px solid var(--vc-black);padding-bottom:4px;margin:0 0 8px}
  .rcp{display:grid;grid-template-columns:82px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--vc-cloud);font-size:10.5px;line-height:1.38}
  .rcp:last-child{border-bottom:0}
  .rcp .rh{font-weight:800}
  .rcp .rn{color:var(--vc-charcoal)}
  .press p{font-size:10.5px;line-height:1.4;margin:0 0 5px}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
  .chip{font-size:10px;font-weight:700;padding:2px 7px;background:var(--vc-paper2);border-radius:2px;white-space:nowrap}
  .chip b{font-weight:900}
  .cite{font-size:9.5px;line-height:1.3;margin:2px 0;padding-left:8px;border-left:2px solid var(--vc-chartreuse)}
  .cite .co{font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:9px;margin-right:5px}
  .block{margin-top:10px}
  .senior{font-size:10px;line-height:1.5;color:var(--vc-black)}
  .senior b{font-weight:900}
  .aud{font-size:10px;line-height:1.4}
  .aud div{padding:2.5px 0;border-bottom:1px solid var(--vc-cloud)}
  .aud div:last-child{border-bottom:0}
  .aud b{font-weight:800}
  .foot{border-top:1.5px solid var(--vc-black);padding-top:8px;font-size:9.5px;color:var(--vc-charcoal);line-height:1.5;display:flex;justify-content:space-between;gap:16px}
  .foot b{color:var(--vc-black);font-weight:800}

  @page{size:letter portrait;margin:0}
  @media print{
    html,body{background:#fff}
    .bar,.gate{display:none !important}
    .sheet{width:auto;min-height:0;margin:0;box-shadow:none;padding:.5in .6in .45in;page-break-after:avoid}
    .cols,.tiles,.rcp{break-inside:avoid}
    a{color:inherit}
  }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gatebox">
    <div class="wordmark">Vital City</div>
    <h1>At a glance</h1>
    <p>The one-page case for support, built from the same nightly data as the deck. Enter the shared passphrase.</p>
    <input id="pw" type="password" placeholder="Passphrase" autocomplete="current-password">
    <button id="unlock">Unlock</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="bar">
    <button class="primary" id="print">Print / save as PDF</button>
    <button id="docx" title="An editable Word document with the same sections and numbers.">Download Word</button>
    <a id="decklink" href="deck.html" target="_blank" rel="noopener">The deck</a>
    <a href="index.html">Back</a>
    <span>One US Letter page. Every number is computed on the nightly rebuild; nothing is hand-typed.</span>
  </div>
  <div class="sheet" id="sheet"></div>
</div>

<script src="vendor/docx.umd.js"></script>
<script>
const $=s=>document.querySelector(s);
const AP=["Jan.","Feb.","March","April","May","June","July","Aug.","Sept.","Oct.","Nov.","Dec."];
const ym=v=>{const m=/^(\d{4})-(\d{2})/.exec(String(v||""));return m?`${AP[+m[2]-1]} ${m[1]}`:String(v||"")};
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const PASSKEY="vc_net_pass", TTL=90*24*3600*1000;
function savePass(p){try{localStorage.setItem(PASSKEY,JSON.stringify({pass:p,exp:Date.now()+TTL}))}catch{}}
function loadPass(){try{const r=localStorage.getItem(PASSKEY);if(!r)return null;if(r[0]!=="{")return r;
  const o=JSON.parse(r);if(o&&o.pass&&o.exp>Date.now())return o.pass;localStorage.removeItem(PASSKEY);return null}catch{return null}}
function b64d(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function decryptBlob(pass,blob){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(blob.salt),iterations:blob.iters,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(blob.iv)},key,b64d(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

const VKEY=(new URLSearchParams(location.search).get("v")||"").toLowerCase();
function build(d){
  const FF=d.funder_facts||{};
  const V=(d.variants||{})[VKEY]||null;
  if(V){ document.title="Vital City — at a glance · "+VKEY; const dl=$("#decklink"); if(dl) dl.href="deck.html?v="+encodeURIComponent(VKEY); }
  const asof=FF.asof||String(d.generated_at||"").slice(0,10);
  const tiles=(FF.tiles||[]).slice(0,8).map(t=>`<div class="tile"><div class="n">${esc(t.n)}</div><div class="l">${esc(t.l)}</div><div class="s">${esc(t.s)}</div></div>`).join("");
  let rlist=(FF.receipts||[]).slice();
  if(V&&V.receipts) rlist.sort((a,b)=>{const i=V.receipts.indexOf(a.head),j=V.receipts.indexOf(b.head);return (i<0?99:i)-(j<0?99:j);});
  const receipts=rlist.slice(0,5).map(r=>`<div class="rcp"><div class="rh">${esc(r.head)}</div><div>${esc(r.claim)}${r.note?` <span class="rn">— ${esc(r.note)}</span>`:""}</div></div>`).join("");
  const joinAnd=a=>a.length>1?a.slice(0,-1).join(", ")+" and "+a.slice(-1)[0]:(a[0]||"");
  const FU=FF.funders_current||{}, G=FF.giving||{};
  const money=n=>"$"+Math.round(n||0).toLocaleString("en-US");
  const funders=(FU.names||[]).length?`<div class="funds"><div class="sec">Who funds us</div>
      <div class="fx">Vital City is underwritten by ${joinAnd((FU.names||[]).map(esc))}${G.donors?`, and by its readers: <b>${esc(G.donors.toLocaleString("en-US"))}</b> individual donors since online giving opened in ${esc(G.since||"")}, median gift ${esc(money(G.median))}${G.big_gifts?`, ${esc(String(G.big_gifts))} gifts of $1,000 or more`:""}`:""}.</div></div>`:"";
  const P=FF.press||{};
  const chips=(P.top||[]).slice(0,5).map(o=>`<span class="chip">${esc(o.outlet)} <b>${esc(String(o.n))}</b></span>`).join("");
  const cites=(P.samples||[]).slice(0,1).map(x=>`<div class="cite"><span class="co">${esc(x.outlet)}</span>${esc(x.title)}</div>`).join("");
  const also=(FF.cited_by_notable||[]).filter(o=>!(P.top||[]).some(t=>t.outlet===o));
  const alsoTxt=(also.length||(FF.republished_by||[]).length)?`<p>${also.length?`Also cited by ${also.map(esc).join(", ")}.`:""}${(FF.republished_by||[]).length?` Essays are republished by ${joinAnd((FF.republished_by||[]).map(esc))}.`:""}</p>`:"";
  const spots=V?(V.spots||[]).slice(0,3):[];
  const clip=(t,n)=>{t=String(t||"");if(t.length<=n)return t;const c=t.slice(0,n);return c.slice(0,c.lastIndexOf(" ")>n-16?c.lastIndexOf(" "):n)+"…"};
  const work=spots.length?`<div class="block"><div class="sec">${esc(V.spot_title||"Selected work")}</div>${spots.map(x=>`<div class="cite">${esc(clip(x.t,56))}${x.a?` <span style="color:var(--vc-charcoal)">— ${esc(x.a)}</span>`:""}</div>`).join("")}</div>`:"";
  const M=FF.mostread;
  const most=M&&M.visitors?`<div class="most"><b>Most read in ${esc(String(M.year))}:</b> “${esc(M.title)}” — ${esc(M.visitors.toLocaleString("en-US"))} readers.</div>`:"";
  const ROLE={"Journalists":"journalists","Current city government":"in city government","Nonprofit leadership":"nonprofit leaders","Academics":"academics","Foundation leadership":"foundation leaders","State government":"in state government","Judges":"judges"};
  const roles=(FF.roles||[]).filter(r=>r.label!=="Contributors"&&r.n).map(r=>`<span class="role"><b>${esc(r.n.toLocaleString("en-US"))}</b> ${esc(ROLE[r.label]||r.label.toLowerCase())}</span>`).join("");
  const PR=FF.power_readers;
  const audRows=(FF.audience||[]).filter(a=>/full size|Government readers|Wikipedia/i.test(a.label)).slice(0,3);
  const AUD={"Email list, full size":["Email list",null],"Wikipedia-notable subscribers":["Subscribers with their own Wikipedia page","matched by name, so a floor"],"Government readers open":["Government readers open",null]};
  const aud=audRows.map(r=>{const m=AUD[r.label]||[r.label,null];return `<div><b>${esc(m[0])}:</b> ${esc(r.value)} <span style="color:var(--vc-charcoal)">— ${esc(m[1]||r.note)}</span></div>`}).join("")
    +(PR&&PR.count?`<div><b>Power readers:</b> ${esc(PR.count.toLocaleString("en-US"))} <span style="color:var(--vc-charcoal)">— one in ${Math.round(100/(PR.pct||10))} subscribers, opening ${esc(String(Math.round(PR.open||0)))}% of everything sent; disproportionately government, academic and press</span></div>`:"");
  const S=FF.senior||{};
  const spot=(V&&V.authors&&S.tags)
    ? V.authors.filter(n=>S.tags[n]).slice(0,6).map(n=>({n,tag:S.tags[n]}))
    : (S.spotlight||[]).slice(0,6);
  const last=n=>n.replace(/\s+(Jr\.|Sr\.|II|III)$/,"").split(" ").slice(-1)[0];
  spot.sort((a,b)=>last(a.n).localeCompare(last(b.n)));
  const spotParts=spot.map(x=>`<b>${esc(x.n)}</b> (${esc(x.tag)})`);
  const spotTxt=joinAnd(spotParts);
  const senior=(S.count? `<div class="block"><div class="sec">Who writes it</div>
      <div class="senior">${esc(String(S.pool||""))} contributors since 2021: criminologists, economists, planners, prosecutors, agency heads, mayors. ${esc(String(S.count))} are named senior contributors on the masthead${spotTxt?`, among them ${spotTxt}`:""}.</div></div>` : "");
  window.__model={asof,V,FF,tiles:(FF.tiles||[]).slice(0,8),receipts:rlist.slice(0,5),roles:(FF.roles||[]).filter(r=>r.label!=="Contributors"&&r.n).map(r=>({n:r.n,label:ROLE[r.label]||r.label.toLowerCase()})),
    aud:audRows.map(r=>{const m=AUD[r.label]||[r.label,null];return {label:m[0],value:r.value,note:m[1]||r.note}}).concat(PR&&PR.count?[{label:"Power readers",value:PR.count.toLocaleString("en-US"),note:`one in ${Math.round(100/(PR.pct||10))} subscribers, opening ${Math.round(PR.open||0)}% of everything sent; disproportionately government, academic and press`}]:[]),
    press:{total:P.total,outlets:P.outlets,since:ym(P.since),top:(P.top||[]).slice(0,5),also,republished:FF.republished_by||[],sample:V?null:(P.samples||[])[0]||null,most:V?null:M},
    spots,writes:{pool:S.pool,count:S.count,spot},funders:{names:FU.names||[],giving:G}};
  $("#sheet").innerHTML=`
    <div class="mast">
      <div>
        <div class="wordmark">Vital City</div>
        <h1>The evidence New York runs on.</h1>
        <div class="dek">${FF.oneliner?esc(FF.oneliner)+" ":""}An independent policy journal, a data and research shop and a convener, all in one.</div>
      </div>
      <div class="asof">${V?`<b style="color:var(--vc-black)">${esc(V.label)}</b><br>`:""}vitalcitynyc.org<br>Computed from live data as of ${esc(asof)}</div>
    </div>
    <div class="tiles">${tiles}</div>
    <div class="cols">
      <div>
        <div class="sec">The receipts — where the work moved policy</div>
        ${receipts}
        ${senior}
      </div>
      <div class="press">
        <div class="sec">Who reads it</div>
        ${roles?`<div class="roles">${roles}</div>`:""}
        <div class="aud">${aud}</div>
        <div class="block"><div class="sec">In the press</div>
        <p><b>${esc(String(P.total||0))}</b> citations in ${esc(String(P.outlets||0))} outlets since ${esc(ym(P.since))}, an undercount, since only a fixed set of outlets is watched.</p>
        <div class="chips">${chips}</div>
        ${alsoTxt}
        ${V?"":cites}
        ${V?"":most}</div>
        ${work}
      </div>
    </div>
    ${funders}
    <div class="foot">
      <div><b>Vital City</b> is a project of the Fund for the City of New York, a 501(c)(3), EIN 13-2612524. Editors Elizabeth Glazer and Greg Berman; managing editor Josh Greenman.</div>
      <div style="text-align:right;white-space:nowrap">Deck, PowerPoint and sources:<br>the case for funders page</div>
    </div>`;
}

async function exportDocx(){
  const m=window.__model; if(!m||!window.docx){alert("The page has not finished loading.");return;}
  const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,AlignmentType,BorderStyle,HeadingLevel,ShadingType}=docx;
  const F="Arial", noB={style:BorderStyle.NONE,size:0,color:"FFFFFF"}, hair={style:BorderStyle.SINGLE,size:4,color:"DDDDDD"};
  const P=(runs,o={})=>new Paragraph({spacing:{after:o.after??80,before:o.before??0},alignment:o.align,children:(Array.isArray(runs)?runs:[runs]).map(r=>typeof r==="string"?new TextRun({text:r,font:F,size:o.size||19,bold:o.bold,color:o.color}):r)});
  const R=(text,o={})=>new TextRun({text,font:F,size:o.size||19,bold:o.bold,color:o.color,italics:o.italics});
  const H=(t)=>new Paragraph({spacing:{before:200,after:60},border:{bottom:{style:BorderStyle.SINGLE,size:8,color:"050507"}},children:[new TextRun({text:t.toUpperCase(),font:F,size:17,bold:true,characterSpacing:20})]});
  const cell=(children,o={})=>new TableCell({children,width:o.w?{size:o.w,type:WidthType.PERCENTAGE}:undefined,borders:{top:o.b||noB,bottom:o.b||noB,left:o.b||noB,right:o.b||noB},margins:{top:80,bottom:80,left:100,right:100},shading:o.fill?{fill:o.fill,type:ShadingType.CLEAR,color:"auto"}:undefined});
  const kids=[];
  kids.push(P([R("VITAL CITY",{bold:true,size:18})],{after:40}));
  kids.push(P([R("The evidence New York runs on.",{size:40})],{after:60}));
  kids.push(P([R((m.FF.oneliner?m.FF.oneliner+" ":"")+"An independent policy journal, a data and research shop and a convener, all in one.")],{after:60}));
  kids.push(P([R((m.V?m.V.label+" · ":"")+"vitalcitynyc.org · Computed from live data as of "+m.asof,{color:"707175",size:16})],{after:160}));
  // tiles as a 2x4 table
  const tiles=m.tiles; const rows=[];
  for(let i=0;i<tiles.length;i+=4){ rows.push(new TableRow({children:tiles.slice(i,i+4).map(t=>cell([P([R(t.n,{bold:true,size:30})],{after:20}),P([R(t.l.toUpperCase(),{bold:true,size:14})],{after:20}),P([R(t.s,{size:15,color:"707175"})],{after:0})],{w:25,b:hair}))})); }
  kids.push(new Table({width:{size:100,type:WidthType.PERCENTAGE},rows}));
  kids.push(H("The receipts — where the work moved policy"));
  kids.push(new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:m.receipts.map(r=>new TableRow({children:[cell([P([R(r.head,{bold:true,size:18})],{after:0})],{w:22,b:hair}),cell([P([R(r.claim,{size:18}),...(r.note?[R(" — "+r.note,{size:18,color:"707175"})]:[])],{after:0})],{w:78,b:hair})]}))}));
  kids.push(H("Who writes it"));
  const w=m.writes; kids.push(P([R(`${w.pool} contributors since 2021: criminologists, economists, planners, prosecutors, agency heads, mayors. ${w.count} are named senior contributors on the masthead`+(w.spot.length?", among them ":".")),...w.spot.flatMap((x,i)=>[R(x.n,{bold:true}),R(` (${x.tag})`+(i<w.spot.length-2?", ":i===w.spot.length-2?" and ":"."))])]));
  kids.push(H("Who reads it"));
  if(m.roles.length) kids.push(P([R(m.roles.map(r=>`${r.n.toLocaleString("en-US")} ${r.label}`).join(" · "))]));
  m.aud.forEach(a=>kids.push(P([R(a.label+": ",{bold:true}),R(a.value),R(a.note?" — "+a.note:"",{color:"707175"})],{after:40})));
  kids.push(H("In the press"));
  const pr=m.press; kids.push(P([R(`${pr.total} citations in ${pr.outlets} outlets since ${pr.since}, an undercount, since only a fixed set of outlets is watched. `),R(pr.top.map(o=>`${o.outlet} ${o.n}`).join(" · "),{bold:true})]));
  if(pr.also.length||pr.republished.length) kids.push(P([R((pr.also.length?`Also cited by ${pr.also.join(", ")}.`:"")+(pr.republished.length?` Essays are republished by ${pr.republished.slice(0,-1).join(", ")} and ${pr.republished.slice(-1)[0]}.`:""))]));
  if(pr.sample) kids.push(P([R(pr.sample.outlet.toUpperCase()+"  ",{bold:true,size:15}),R(pr.sample.title)]));
  if(pr.most&&pr.most.visitors) kids.push(P([R(`Most read in ${pr.most.year}: `,{bold:true}),R(`“${pr.most.title}” — ${pr.most.visitors.toLocaleString("en-US")} readers.`)]));
  if(m.spots.length){ kids.push(H(m.V.spot_title||"Selected work")); m.spots.forEach(x=>kids.push(P([R(x.t),R(x.a?" — "+x.a:"",{color:"707175"})],{after:40}))); }
  if(m.funders.names.length){ kids.push(H("Who funds us")); const G=m.funders.giving||{}; const money=n=>"$"+Math.round(n||0).toLocaleString("en-US");
    kids.push(P([R("Vital City is underwritten by "+m.funders.names.slice(0,-1).join(", ")+" and "+m.funders.names.slice(-1)[0]+(G.donors?`, and by its readers: ${G.donors.toLocaleString("en-US")} individual donors since online giving opened in ${G.since||""}, median gift ${money(G.median)}${G.big_gifts?`, ${G.big_gifts} gifts of $1,000 or more`:""}`:"")+".")])); }
  kids.push(P([R("Vital City is a project of the Fund for the City of New York, a 501(c)(3), EIN 13-2612524. Editors Elizabeth Glazer and Greg Berman; managing editor Josh Greenman.",{size:15,color:"707175"})],{before:200}));
  const doc=new Document({styles:{default:{document:{run:{font:F,size:19}}}},sections:[{properties:{page:{size:{width:12240,height:15840},margin:{top:864,bottom:864,left:864,right:864}}},children:kids}]});
  const blob=await Packer.toBlob(doc); window.__lastDocxSize=blob.size;
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`Vital-City-one-pager-${VKEY?VKEY+"-":""}${m.asof}.docx`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
}

async function unlock(fromStore){
  $("#err").textContent="";
  const pass=$("#pw").value.trim(); if(!pass){$("#err").textContent="Enter the passphrase.";return}
  try{
    const blob=await fetch("data.enc",{cache:"no-cache"}).then(r=>r.json());
    const data=await decryptBlob(pass,blob);
    savePass(pass); $("#gate").style.display="none"; $("#app").style.display="";
    build(data);
  }catch(e){console.error(e);$("#err").textContent="Wrong passphrase, or data unavailable.";if(fromStore)try{localStorage.removeItem(PASSKEY)}catch{}}
}
$("#unlock").addEventListener("click",()=>unlock(false));
$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock(false)});
$("#print").addEventListener("click",()=>window.print());
document.addEventListener("keydown",e=>{if((e.key==="p"||e.key==="P")&&!e.metaKey&&!e.ctrlKey&&$("#app").style.display!=="none")window.print()});
(async()=>{const p=loadPass();if(p){$("#pw").value=p;await unlock(true)}})();
