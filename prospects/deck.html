<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Vital City — the case for support</title>
<style>
  @font-face{font-family:'GascogneTS';src:url('../growth/fonts/GascogneTS-Light.ttf') format('truetype');
             font-weight:300 900;font-style:normal;font-display:swap;}
  :root{
    --vc-paper:#f7f7f4; --vc-white:#fff; --vc-black:#050507; --vc-charcoal:#707175;
    --vc-cloud:#dddddd; --vc-green:#57aa4a; --vc-orange:#ff7c53; --vc-cerulean:#217ebe;
    --vc-magenta:#e7466d; --vc-paper2:#eeeeec; --vc-plum:#7a5ea6; --vc-gold:#d9a441;
    --vc-sans:"halyard-text","Inter Tight","Inter",system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;
    --vc-serif:"GascogneTS","Source Serif 4",Georgia,Times,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--vc-paper2);color:var(--vc-black);font-family:var(--vc-sans);
       font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--vc-cerulean)}

  /* gate — identical passphrase flow to the rest of the suite */
  .gate{position:fixed;inset:0;background:var(--vc-paper);display:flex;align-items:center;justify-content:center;z-index:500}
  .gatebox{background:var(--vc-white);border:1px solid var(--vc-black);padding:34px 38px;max-width:420px;
           box-shadow:7px 7px 0 rgba(5,5,7,.14)}
  .gatebox h1{font-size:20px;margin:0 0 6px}
  .gatebox p{font-size:12.5px;color:var(--vc-charcoal);margin:0 0 16px;line-height:1.5}
  .gatebox input{width:100%;padding:10px 12px;border:1.5px solid var(--vc-black);font-family:inherit;font-size:14px;background:var(--vc-white);color:var(--vc-black)}
  .gatebox button{margin-top:12px;width:100%;padding:10px;border:1.5px solid var(--vc-black);background:var(--vc-black);
                  color:var(--vc-white);font-family:inherit;font-weight:800;font-size:13px;cursor:pointer}
  .err{color:var(--vc-magenta);font-size:12px;margin-top:8px;min-height:16px}

  /* deck */
  .stage{max-width:1080px;margin:0 auto;padding:18px 16px 70px}
  .slide{background:var(--vc-white);border:1px solid var(--vc-black);box-shadow:7px 7px 0 rgba(5,5,7,.10);
         padding:46px 54px;margin-bottom:22px;min-height:600px;display:flex;flex-direction:column;
         position:relative;page-break-after:always;break-after:page}
  .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.18em;font-weight:800;color:var(--vc-cerulean);width:fit-content}
  .eyebrow::after{content:"";display:block;width:100%;height:3px;background:var(--vc-orange);margin-top:8px}
  .wm{font-weight:900;letter-spacing:.22em;font-size:12px;text-transform:uppercase}
  .slide h2{font-family:var(--vc-serif);font-weight:700;font-size:40px;line-height:1.08;letter-spacing:-.01em;margin:16px 0 12px;max-width:24ch}
  .slide h3{font-size:18px;margin:14px 0 6px;letter-spacing:-.01em;font-weight:900}
  .lede{font-size:16.5px;line-height:1.5;max-width:62ch;margin:0 0 16px}
  .foot{position:absolute;left:54px;right:54px;bottom:18px;display:flex;justify-content:space-between;
        font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--vc-charcoal);font-weight:700}

  /* cover — black, in the house style */
  .cover{justify-content:center;background:var(--vc-black);color:var(--vc-paper);border-color:var(--vc-black)}
  .cover .eyebrow{color:var(--vc-orange)}
  .cover h1{font-family:var(--vc-serif);font-weight:700;font-size:74px;line-height:1.0;letter-spacing:-.015em;margin:20px 0 18px;max-width:18ch}
  .cover .sub{font-size:18px;color:#c9ccd2;max-width:52ch;line-height:1.55}
  .cover .foot{color:#8a8d94}
  .cover .cdate{color:#6f727a}

  /* figures — serif numerals, the house look */
  .figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2px;background:var(--vc-black);
        border:1px solid var(--vc-black);margin:8px 0 16px}
  .fig{background:var(--vc-white);padding:18px 18px 15px}
  .fig .v{font-family:var(--vc-serif);font-size:46px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .fig .v small{font-size:24px}
  .fig .k{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;margin-top:7px}
  .fig .n{font-size:11px;color:var(--vc-charcoal);margin-top:3px;line-height:1.45}
  .fig.hero{background:var(--vc-black);color:var(--vc-paper)}
  .fig.hero .n{color:#a2a5ad}

  .rows{border-top:2px solid var(--vc-black)}
  .row{border-bottom:1px solid var(--vc-cloud);padding:12px 0;display:flex;gap:16px;align-items:baseline}
  .row .rk{flex:0 0 190px;font-weight:900;font-size:13.5px}
  .row .rv{flex:1;font-size:14px;line-height:1.5}
  .row .rn{font-size:11.5px;color:var(--vc-charcoal);margin-top:2px;line-height:1.45}
  .links a{font-size:11px;margin-right:10px;white-space:nowrap}

  .bullets{margin:0;padding-left:19px;max-width:64ch}
  .bullets li{margin-bottom:10px;font-size:15px;line-height:1.5}
  .bullets li::marker{color:var(--vc-orange);font-weight:900}

  /* press */
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 14px}
  .chip{background:var(--vc-paper2);border-radius:3px;padding:5px 11px;font-size:12px;font-weight:700}
  .chip b{font-family:var(--vc-serif);font-size:15px;margin-left:3px}
  .chip.first{background:var(--vc-black);color:var(--vc-paper)}
  .cite{font-size:13.5px;padding:8px 0 8px 14px;border-left:3px solid var(--vc-orange);margin:9px 0;line-height:1.45}
  .cite .co{font-weight:900;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;margin-right:8px}
  .cite .cd{color:var(--vc-charcoal);font-size:11px;margin-left:8px}

  .caveat{border-left:3px solid var(--vc-gold);background:#fdf8ec;padding:10px 14px;font-size:12px;
          line-height:1.5;margin:12px 0}
  .src{font-size:11.5px;color:var(--vc-charcoal);line-height:1.6}
  .src b{color:var(--vc-black)}
  .pull{font-family:var(--vc-serif);font-size:23px;line-height:1.35;max-width:32ch;margin:18px 0}

  /* the live site, framed as a browser window — Vital City uses the text
     wordmark only (house rule: never the raster logo), so the site itself is
     the visual identity here */
  .browserframe{border:1.5px solid var(--vc-black);background:var(--vc-white);
                box-shadow:9px 9px 0 var(--vc-orange);margin:14px 0 8px;max-width:860px}
  .bf-bar{display:flex;align-items:center;gap:6px;background:var(--vc-paper2);
          border-bottom:1.5px solid var(--vc-black);padding:8px 12px}
  .bf-bar i{width:9px;height:9px;border-radius:50%;background:var(--vc-cloud);display:inline-block}
  .bf-bar i:nth-child(1){background:var(--vc-magenta)}
  .bf-bar i:nth-child(2){background:var(--vc-gold)}
  .bf-bar i:nth-child(3){background:var(--vc-green)}
  .bf-url{font-size:11px;color:var(--vc-charcoal);font-weight:700;margin-left:8px;letter-spacing:.03em}
  .bf-view{position:relative;height:430px;overflow:hidden;background:var(--vc-paper)}
  .bf-view iframe{width:200%;height:860px;border:0;transform:scale(.5);transform-origin:0 0;pointer-events:none}
  .bf-cap{font-size:11px;color:var(--vc-charcoal);margin-top:8px}
  .tq{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--vc-cloud);border:1px solid var(--vc-cloud);margin-top:12px}
  .tqi{background:var(--vc-white);padding:14px 16px}
  .tqq{font-family:var(--vc-serif);font-size:17px;line-height:1.3}
  .tqw{font-size:11px;color:var(--vc-charcoal);margin-top:8px}
  @media(max-width:700px){.tq{grid-template-columns:1fr}}
  .clogo{width:230px;margin-bottom:30px;filter:brightness(0) invert(1)}   /* black art -> paper white on the cover */
  .slide:not(.cover) .slogo{position:absolute;top:46px;right:54px;width:110px;opacity:.85}

  /* bylines grid */
  .bygrid{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--vc-cloud);border:1px solid var(--vc-cloud);margin-top:8px}
  .by{background:var(--vc-white);padding:13px 15px}
  .by .bn{font-family:var(--vc-serif);font-weight:700;font-size:19px;line-height:1.1}
  .by .bw{font-size:11px;color:var(--vc-charcoal);margin:3px 0 5px;line-height:1.4}
  .by .bp{font-size:11.5px;line-height:1.45}
  .by .bp .more{color:var(--vc-charcoal);font-size:10.5px}
  @media(max-width:700px){.bygrid{grid-template-columns:1fr}}

  /* long-view bars */
  .yrchart{margin:6px 0 4px}
  .yrrow{display:grid;grid-template-columns:46px 1fr;gap:4px 10px;align-items:center;margin:9px 0}
  .yrrow .yl{font-weight:900;font-size:13px;font-variant-numeric:tabular-nums}
  .yrrow .ytrack{position:relative;height:26px;display:block}
  .yrrow .yb{height:26px;background:var(--vc-cerulean);min-width:2px;display:block}
  .yrrow.alt .yb{background:var(--vc-orange)}
  .yrrow .ymeta{grid-column:2;display:flex;gap:8px;align-items:baseline;margin-top:-2px}
  .yrrow .yv{font-family:var(--vc-serif);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .yrrow .yn{font-size:10.5px;color:var(--vc-charcoal)}
  .twochart{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:30px}
  @media(max-width:700px){.twochart{grid-template-columns:1fr}}

  /* nav */
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--vc-black);color:var(--vc-white);
       display:flex;align-items:center;justify-content:space-between;padding:8px 16px;font-size:11px;
       letter-spacing:.08em;text-transform:uppercase;font-weight:700;z-index:400}
  .bar button{background:none;border:1.5px solid var(--vc-white);color:var(--vc-white);font-family:inherit;
              font-weight:800;font-size:11px;padding:5px 12px;cursor:pointer;margin-left:6px;letter-spacing:.06em}

  @page{size:letter landscape;margin:0.35in}
  @media print{
    body{background:#fff}
    .bar,.gate{display:none!important}
    .stage{max-width:none;padding:0}
    /* one slide per landscape sheet: fixed height, no growth, no orphaned
       half-slides on the next page */
    .slide{box-shadow:none;border:none;margin:0;height:7.3in;min-height:0;max-height:7.3in;
           overflow:hidden;padding:30px 40px;page-break-inside:avoid;break-inside:avoid}
    .slide h2{font-size:34px}
    .cover h1{font-size:60px}
    .bf-view{height:330px}
    .cover{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .fig.hero,.chip.first{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  @media (max-width:700px){
    .slide{padding:28px 22px;min-height:0}
    .cover h1{font-size:44px}
    .slide h2{font-size:28px}
    .foot{position:static;margin-top:22px}
    .row{display:block}
    .row .rk{flex:none;margin-bottom:2px}
  }
</style>
<script src="vendor/pptxgen.bundle.js"></script>
</head>
<body>

<div class="gate" id="gate">
  <div class="gatebox">
    <div class="wm">Vital City</div>
    <h1>The case for support</h1>
    <p>Fundraising material. Same passphrase as the contacts, growth and prospects tools.</p>
    <input id="pw" type="password" placeholder="Passphrase" autocomplete="current-password">
    <button id="unlock">Unlock</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="stage" id="stage"></div>
  <div class="bar">
    <div><span class="wm">Vital City</span> &nbsp;·&nbsp; the case for support</div>
    <div>
      <span id="pos"></span>
      <button id="prev">&larr;</button><button id="next">&rarr;</button>
      <button id="print">Print / PDF</button>
      <button id="pptx" title="Downloads an editable PowerPoint (.pptx) built from the same live data — every number and sentence is a text box you can change in PowerPoint, Keynote or Google Slides.">&#9998; PowerPoint</button>
      <button id="email" title="Downloads a self-contained copy of the deck (no passphrase needed to open it) and opens an email draft — attach the downloaded file, or a printed PDF, to the draft.">&#9993; Email</button>
      <button id="lock">Lock</button>
    </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const PASSKEY="vc_net_pass", TTL=90*24*3600*1000;
function savePass(p){try{localStorage.setItem(PASSKEY,JSON.stringify({pass:p,exp:Date.now()+TTL}))}catch{}}
function loadPass(){try{const r=localStorage.getItem(PASSKEY);if(!r)return null;if(r[0]!=="{")return r;
  const o=JSON.parse(r);if(o&&o.pass&&o.exp>Date.now())return o.pass;localStorage.removeItem(PASSKEY);return null}catch{return null}}
function b64d(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function decryptBlob(pass,blob){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(blob.salt),iterations:blob.iters,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(blob.iv)},key,b64d(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlock(fromStore){
  $("#err").textContent="";
  const pass=$("#pw").value.trim(); if(!pass){$("#err").textContent="Enter the passphrase.";return}
  try{
    const blob=await fetch("data.enc",{cache:"no-cache"}).then(r=>r.json());
    const data=await decryptBlob(pass,blob);
    savePass(pass); $("#gate").style.display="none"; $("#app").style.display="";
    build(data);
  }catch(e){console.error(e);$("#err").textContent="Wrong passphrase, or data unavailable.";if(fromStore)try{localStorage.removeItem(PASSKEY)}catch{}}
}
$("#unlock").addEventListener("click",()=>unlock(false));
$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock(false)});
(async()=>{const p=loadPass();if(p){$("#pw").value=p;await unlock(true)}})();
$("#lock").addEventListener("click",e=>{e.preventDefault();try{localStorage.removeItem(PASSKEY)}catch{};location.reload()});
$("#print").addEventListener("click",()=>window.print());
// "Email the deck": the gated URL is useless to a funder (and the passphrase
// must never leave the team — it unlocks the contact database too). So this
// exports a SELF-CONTAINED, ungated copy of the rendered deck: the DOM as it
// stands, gate and controls stripped, logo inlined. The payload is only what
// is already on the slides — funder_facts and topline — never the prospect
// tiers or any contact data, which live on the other page entirely.
async function emailDeck(){
  if(getComputedStyle($("#gate")).display!=="none") return;
  let logoData="";
  try{
    const blob=await fetch("vc-logo-black.png").then(r=>r.blob());
    logoData=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(blob);});
  }catch(e){}
  const doc=document.documentElement.cloneNode(true);
  doc.querySelectorAll("#gate,.bar,script").forEach(n=>n.remove());
  if(logoData) doc.querySelectorAll("img[src='vc-logo-black.png']").forEach(i=>i.setAttribute("src",logoData));
  const app=doc.querySelector("#app"); if(app) app.style.display="";
  const stamp=(FF.asof||"").slice(0,10);
  const note=doc.createElement("div");
  note.setAttribute("style","max-width:1080px;margin:0 auto;padding:6px 16px 26px;font-size:11px;color:#707175;font-family:system-ui,sans-serif");
  note.textContent="Vital City — the case for support · generated "+stamp+" · figures computed from live systems as of that date.";
  (doc.querySelector(".stage")||doc.querySelector("body")).appendChild(note);
  const html="<!doctype html>\n"+doc.outerHTML;
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));
  a.download=`Vital-City-case-for-support-${VKEY?VKEY+"-":""}${stamp}.html`;
  a.click(); URL.revokeObjectURL(a.href);
  setTimeout(()=>{
    const su=encodeURIComponent("Vital City — the case for support");
    const bo=encodeURIComponent(
      "Sharing Vital City's case for support (attached; current as of "+stamp+").\n\n"+
      "Vital City is a nonprofit journal, research shop and convener focused on pragmatic solutions to tough urban problems in New York City.\n\n"+
      "[Attach the file that just downloaded — or a PDF printed from it — before sending.]");
    window.open("mailto:?subject="+su+"&body="+bo,"_self");
  },600);
}
$("#email").addEventListener("click",emailDeck);

// ---- editable export: a designed .pptx from the DATA (not the DOM) --------
// Same design system as the HTML: black cover, Georgia display, orange eyebrow
// rule, black-bordered figure tiles with a hero tile, hairline rows, native
// bar charts. Every element is a real text box / table / chart, so the file is
// fully editable in PowerPoint, Keynote or Google Slides. Links become
// clickable hyperlinks, never pasted URLs.
async function exportPptx(){
  if(getComputedStyle($("#gate")).display!=="none") return;
  if(typeof PptxGenJS==="undefined"){alert("PowerPoint library did not load — hard-refresh and try again.");return;}
  const pptx=new PptxGenJS();
  pptx.layout="LAYOUT_WIDE"; pptx.title="Vital City — the case for support";
  const BLK="050507",PAP="F7F7F4",CHAR="707175",ORG="FF7C53",CER="217EBE",WHT="FFFFFF",CLOUD="DDDDDD",PAP2="EEEEEC",GOLD="D9A441";
  const SERIF="Georgia", SANS="Helvetica Neue";
  const t=D.topline||{}, P=FF.press||{}, asof=(FF.asof||"").slice(0,10), V=(D.variants||{})[VKEY]||null;
  const W=13.33, L=0.7, CW=W-2*L;   // slide width, left margin, content width
  const asData=async(u)=>{try{const b=await fetch(u).then(r=>r.blob());return await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b);});}catch(e){return null;}};
  const logo=await asData("vc-logo-black.png"), logoW=await asData("vc-logo-white.png");
  const tile=l=>((FF.tiles||[]).find(x=>(x.l||"").toLowerCase().startsWith(l.toLowerCase())))||{};
  const arow=(arr,l)=>((arr||[]).find(r=>(r.label||"").toLowerCase().startsWith(l.toLowerCase())))||{};

  // ---- primitives ----
  // PowerPoint gives every text box a 0.1in internal margin, which pushed all
  // type 0.1in right of the shapes it is meant to align with — the eyebrow rule
  // and the row hairlines started left of their text and ended short of it.
  // Zero the insets so text and rules share one left edge.
  const TX=(sl,t,o)=>sl.addText(t,Object.assign({margin:0},o));
  let n=0;
  function slide(eyebrow,head,opts={}){
    n++; const s=pptx.addSlide(); const dark=!!opts.dark;
    s.background={color:dark?BLK:WHT};
    const lg=dark?(logoW||logo):logo;
    if(lg) s.addImage({data:lg,x:dark?L:W-L-1.25,y:dark?0.75:0.45,w:dark?2.3:1.25,h:dark?0.48:0.26});
    if(eyebrow){
      TX(s,eyebrow.toUpperCase(),{x:L,y:dark?1.6:0.5,w:8,h:0.28,fontSize:9,bold:true,color:dark?ORG:CER,charSpacing:4,fontFace:SANS});
      // orange rule sized to the word: ~0.075in per char at 9pt with tracking
      s.addShape(pptx.ShapeType.rect,{x:L,y:dark?1.9:0.8,w:Math.max(0.5,eyebrow.length*0.086),h:0.045,fill:{color:ORG},line:{color:ORG,width:0}});
    }
    if(head){
      // Cover: a 7.4in box forces "The evidence / New York runs on." (two lines,
      // no orphan). Interior: measured to the headline so the lede sits right
      // under it instead of at a fixed y — a 3-line headline no longer collides.
      const lines=dark?2:Math.min(3,Math.ceil(head.replace(/\n/g,"").length/58));
      const hh=dark?2.0:0.44*lines+0.15;
      TX(s,head,{x:L,y:dark?2.05:0.95,w:dark?9.6:CW,h:hh,fontSize:dark?44:27,bold:true,color:dark?PAP:BLK,fontFace:SERIF,valign:"top",fit:"shrink",lineSpacingMultiple:0.95});
      s._bodyY=(dark?2.05:0.95)+hh+0.22;   // where body content may begin
    }
    TX(s,`Vital City · The case for support`,{x:L,y:7.02,w:6,h:0.25,fontSize:7.5,color:dark?"8A8D94":CHAR,charSpacing:2,fontFace:SANS});
    TX(s,String(n).padStart(2,"0"),{x:W-L-1,y:7.02,w:1,h:0.25,fontSize:7.5,color:dark?"8A8D94":CHAR,align:"right",fontFace:SANS});
    return s;
  }
  function figs(s,y,items){
    // black-bordered tile strip, hero tile inverted — the HTML .figs look
    const k=items.length, gap=0.04, w=(CW-gap*(k-1))/k, h=1.5;
    s.addShape(pptx.ShapeType.rect,{x:L-0.02,y:y-0.02,w:CW+0.04,h:h+0.04,fill:{color:BLK},line:{color:BLK,width:0}});
    items.forEach((it,i)=>{
      const x=L+i*(w+gap), hero=!!it.hero;
      s.addShape(pptx.ShapeType.rect,{x,y,w,h,fill:{color:hero?BLK:WHT},line:{color:hero?BLK:WHT,width:0}});
      TX(s,String(it.v),{x:x+0.2,y:y+0.12,w:w-0.4,h:0.7,fontSize:34,bold:true,color:hero?PAP:BLK,fontFace:SERIF,fit:"shrink"});
      TX(s,String(it.k).toUpperCase(),{x:x+0.2,y:y+0.84,w:w-0.4,h:0.26,fontSize:8.5,bold:true,color:hero?PAP:BLK,charSpacing:1.5,fontFace:SANS});

  S.push({eyebrow:"The moment",html:`

  S.push({eyebrow:"The long view",html:`
    <h2>Year over year over year.</h2>
    ${(()=>{

      const chart=(rows,alt,noteFor)=>{

        // 0-100% of it; value and note sit BELOW the bar so text can never

        return `<div class="yrchart">${rows.map(r=>`

      <p><b>Caveats that travel with these numbers.</b> Giving is Donorbox only. The 2025 signup surge is bot-inflated; 2024 is the volume baseline. Open rates are inflated industry-wide by Apple Mail, which is why click-to-open leads. Press counts are floors, since only those outlets are watched.</p>

      <p><b>This deck was assembled with AI assistance.</b> Every figure comes from a primary Vital City system; verify any figure before it goes to a funder.</p>

}

function build(data){
  D=data||{}; FF=D.funder_facts||{};
  const S=slides();
  $("#stage").innerHTML=S.map((s,i)=>`
    <section class="slide${s.cover?" cover":""}" id="s${i}">
      ${s.cover?"":`<img class="slogo" src="vc-logo-black.png" alt="">`}
      ${s.eyebrow?`<div class="eyebrow">${esc(s.eyebrow)}</div>`:""}
      ${s.html}
      <div class="foot"><span>Vital City · The case for support</span><span>${s.cover?`<span class="cdate">Prepared ${esc(s.date)}</span> &nbsp;·&nbsp; `:""}${String(i+1).padStart(2,"0")}</span></div>
    </section>`).join("");
  let cur=0;
  const go=i=>{cur=Math.max(0,Math.min(S.length-1,i));
    document.getElementById("s"+cur).scrollIntoView({behavior:"smooth",block:"start"});
    $("#pos").textContent=`${cur+1} / ${S.length}`;};
  $("#pos").textContent=`1 / ${S.length}`;
  $("#next").addEventListener("click",()=>go(cur+1));
  $("#prev").addEventListener("click",()=>go(cur-1));
  document.addEventListener("keydown",e=>{
    if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();go(cur+1)}
    if(e.key==="ArrowLeft"){e.preventDefault();go(cur-1)}
    if(e.key==="p"||e.key==="P"){window.print()}
  });
}
</script>
