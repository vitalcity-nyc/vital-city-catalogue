name: tweet-suggester

# UNPLUGGED 2026-09-10. The hourly schedule was removed after every run
# aborted on an empty ANTHROPIC_API_KEY repo secret. The workflow stays here so
# it can be run by hand from the Actions tab; to plug it back in, restore the
# schedule block (it was "0 13-23 * * 1-5", hourly on weekdays through Vital
# City's publishing hours) and set the ANTHROPIC_API_KEY and Slack secrets.
#
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        default: "7"
      dry_run:
        description: "List new pieces without drafting (spends nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tweet-suggester
  cancel-in-progress: false

jobs:
  suggest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the style screen still works
        run: python3 tweet_suggester.py --self-test

      - name: Scan and draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DM_TO: ${{ secrets.SLACK_DM_TO }}
        run: |
          python3 tweet_suggester.py \
            --days "${{ github.event.inputs.days || 7 }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '--slack' }}

      - name: Remember what has been suggested
        if: github.event.inputs.dry_run != 'true'
        run: |
          if git diff --quiet -- data/tweet_suggester_seen.json; then
            echo "nothing new this run"
            exit 0
          fi
          git config user.name  "vital-city-bot"
          git config user.email "actions@github.com"
          git add data/tweet_suggester_seen.json
          git commit -m "Suggested posts for new pieces [skip ci]"
          # network-refresh commits to the same branch twice a day; rebase rather
          # than fail a run whose Slack message has already gone out.
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          exit 1
